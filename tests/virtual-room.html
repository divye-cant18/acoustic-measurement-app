<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>Virtual room · test harness</title>
<link rel="stylesheet" href="css/app.css">
<style>
  #vr-panel{position:fixed;right:12px;bottom:84px;z-index:200;background:#111;color:#eee;font:12px/1.4 system-ui,sans-serif;padding:10px 12px;border-radius:10px;max-width:280px;opacity:.92}
  #vr-panel b{color:#ffb4a8}
</style>
</head>
<body>
<!-- TEST HARNESS: the application with a virtual room instead of a microphone (tests/virtual-room.js). Not part of the app. -->
<div id="vr-panel"><b>TEST HARNESS</b> · virtual room instead of a microphone. Controls: window.VR</div>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="tests/virtual-room.js"></script>
<script>
  // Load exactly the scripts index.html loads, in the same order, then the fixtures the virtual room uses.
  window.HARNESS_READY = (async () => {
    const html = await (await fetch('index.html', { cache: 'no-store' })).text();
    // The fixtures build the virtual room's impulse response; they need the app's DSP, and must exist before the app starts.
    const srcs = [...html.matchAll(/<script src="([^"]+)"/g)].map(m => m[1]).flatMap(s => (s === 'js/measurement/dsp.js' ? [s, 'tests/fixtures.js'] : [s]));
    for (const src of srcs) {
      await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src)); document.body.appendChild(s); });
    }
    return srcs;
  })();
</script>
</body>
</html>
