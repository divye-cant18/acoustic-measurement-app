<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>Sweep level · end-to-end test</title>
<link rel="stylesheet" href="css/app.css">
<style>
  #sl-test{position:fixed;left:12px;bottom:12px;z-index:300;width:min(560px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:#fff;color:#14191b;border:1px solid #d9dee0;border-radius:10px;padding:12px 14px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.15)}
  #sl-test h1{font-size:15px;margin:0 0 6px} #sl-test li{margin:4px 0;list-style:none} #sl-test ol{padding:0;margin:6px 0}
  #sl-test .ok b{color:#16884a} #sl-test .bad b{color:#c42e42} #sl-test small{color:#566065}
</style>
</head>
<body>
<!-- TEST HARNESS: the whole application in a virtual room (tests/virtual-room.js), driven by tests/sweep-level.test.js.
     Development only. Real takes at two sweep levels, processed by the app, then what is stored and shown is checked. -->
<div id="sl-test"><h1>Sweep level · end-to-end</h1>
  <p>Runs the real app with a virtual device: background, a take at 0 dB, a take at +3 dB, processing, the − / + / reset
  controls, and checks what is saved and shown. About a minute. The browser needs one click to allow audio.</p>
  <button id="sl-run" type="button">Run the test</button> <span id="sl-status"></span><ol id="sl-out"></ol></div>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="tests/virtual-room.js"></script>
<script>
  // As tests/virtual-room.html: exactly the scripts index.html loads, with the fixtures after the DSP.
  window.HARNESS_READY = (async () => {
    const html = await (await fetch('index.html', { cache: 'no-store' })).text();
    const srcs = [...html.matchAll(/<script src="([^"]+)"/g)].map(m => m[1]).flatMap(s => (s === 'js/measurement/dsp.js' ? [s, 'tests/fixtures.js'] : [s]));
    for (const src of srcs) await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src)); document.body.appendChild(s); });
    return srcs;
  })();
</script>
<script src="tests/sweep-level.test.js"></script>
</body>
</html>
