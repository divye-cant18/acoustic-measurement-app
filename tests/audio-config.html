<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>Audio configuration, noise floor and integrity tests</title>
<link rel="stylesheet" href="css/app.css">
<style>
  #ac-test{position:fixed;inset:12px 12px auto auto;z-index:300;width:min(660px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fff;color:#14191b;border:1px solid #d9dee0;border-radius:10px;padding:12px 14px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.15)}
  #ac-test h1{font-size:15px;margin:0 0 6px} #ac-test li{margin:4px 0;list-style:none} #ac-test ol{padding:0;margin:6px 0}
  #ac-test .ok b{color:#16884a} #ac-test .bad b{color:#c42e42} #ac-test small{color:#566065}
</style>
</head>
<body>
<!-- TEST PAGE (development only). Part A (on open): the noise floor, recording integrity, the processing decisions, the
     fixed-band headline, the device profiles and the report, on deterministic synthetic audio and the app's own code.
     Part B (button, it needs audio): the whole app with a virtual device (tests/virtual-room.js) for permission denial, a
     missing device, a disconnection and interrupted takes. Synthetic tests check the software, not real hardware. -->
<div id="ac-test"><h1>Audio configuration · noise floor · integrity</h1>
  <p>Part A runs now. Part B (virtual device, about 40 s) needs a click.</p>
  <button id="ac-run" type="button">Run part B</button> <span id="ac-status">Running…</span><ol id="ac-out"></ol></div>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="tests/virtual-room.js"></script>
<script>
  // As tests/virtual-room.html: exactly the scripts index.html loads, with the fixtures after the DSP. Storage is under
  // the virtual room's own prefix.
  window.APP_READY = (async () => {
    const html = await (await fetch('index.html', { cache: 'no-store' })).text();
    const srcs = [...html.matchAll(/<script src="([^"]+)"/g)].map(m => m[1]).flatMap(s => (s === 'js/measurement/dsp.js' ? [s, 'tests/fixtures.js'] : [s]));
    for (const src of srcs) await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src)); document.body.appendChild(s); });
    return srcs;
  })();
</script>
<script src="tests/audio-config.test.js"></script>
</body>
</html>
