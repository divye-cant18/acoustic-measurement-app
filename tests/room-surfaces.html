<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>Room surfaces tests</title>
<link rel="stylesheet" href="css/app.css">
<style>
  #rm-test{position:fixed;inset:12px 12px auto auto;z-index:300;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fff;color:#14191b;border:1px solid #d9dee0;border-radius:10px;padding:12px 14px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.15)}
  #rm-test h1{font-size:15px;margin:0 0 6px} #rm-test li{margin:4px 0;list-style:none} #rm-test ol{padding:0;margin:6px 0}
  #rm-test .ok b{color:#16884a} #rm-test .bad b{color:#c42e42} #rm-test small{color:#566065}
</style>
</head>
<body>
<!-- TEST PAGE: the whole application (scripts as index.html loads them) with its storage under a separate prefix, driven
     by tests/room-surfaces.test.js. Development only. -->
<div id="rm-test"><h1>Room surfaces · no untreated-room prediction</h1><p id="rm-status">Running…</p><ol id="rm-out"></ol></div>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script>
  // Projects made here are stored under their own prefix, so they never appear in the application's history.
  (function () {
    const PREFIX = 'room-surfaces-test:', sp = Storage.prototype, gi = sp.getItem, si = sp.setItem, ri = sp.removeItem;
    sp.getItem = function (k) { return gi.call(this, PREFIX + k); };
    sp.setItem = function (k, v) { return si.call(this, PREFIX + k, v); };
    sp.removeItem = function (k) { return ri.call(this, PREFIX + k); };
  })();
  window.APP_READY = (async () => {
    const html = await (await fetch('index.html', { cache: 'no-store' })).text();
    const srcs = [...html.matchAll(/<script src="([^"]+)"/g)].map(m => m[1]).flatMap(s => (s === 'js/measurement/dsp.js' ? [s, 'tests/fixtures.js'] : [s]));
    for (const src of srcs) await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src)); document.body.appendChild(s); });
    return srcs;
  })();
</script>
<script src="tests/room-surfaces.test.js"></script>
</body>
</html>
