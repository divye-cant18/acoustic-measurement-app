<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>RT60 responsiveness audit</title>
<link rel="stylesheet" href="css/app.css">
<style>
  #rs-test{position:fixed;left:12px;bottom:12px;z-index:300;width:min(640px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;color:#14191b;border:1px solid #d9dee0;border-radius:10px;padding:12px 14px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.15)}
  #rs-test h1{font-size:15px;margin:0 0 6px} #rs-test li{margin:4px 0;list-style:none} #rs-test ol{padding:0;margin:6px 0}
  #rs-test .ok b{color:#16884a} #rs-test .bad b{color:#c42e42} #rs-test small{color:#566065}
</style>
</head>
<body>
<!-- AUDIT TEST (development only): does the measured RT60 follow the room, and only the room?
     Part A runs the production analysis (AM.analysis.analyseTake) and processing (AM.services.processing.evaluate) on
     synthetic recordings of known rooms (tests/fixtures.js), one factor at a time. It starts on load.
     Part B runs the whole application with a virtual device (tests/virtual-room.js): takes of rooms that change, a take
     left unprocessed, an invalid take, and what the screen and the report show after each. It needs one click (audio).
     Results on the page and in window.RESP_TEST; tables in window.RESP_TABLES. See docs/RT60-RESPONSIVENESS-AUDIT.md. -->
<div id="rs-test"><h1>RT60 responsiveness audit</h1>
  <p>Part A (production analysis on known rooms) runs now. Part B (the whole app, virtual device, about 90 s) needs a click.</p>
  <button id="rs-run" type="button">Run part B</button> <span id="rs-status"></span><ol id="rs-out"></ol></div>
<div id="app" class="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="tests/virtual-room.js"></script>
<script>
  // As tests/virtual-room.html: exactly the scripts index.html loads, with the fixtures after the DSP.
  window.HARNESS_READY = (async () => {
    const html = await (await fetch('index.html', { cache: 'no-store' })).text();
    const srcs = [...html.matchAll(/<script src="([^"]+)"/g)].map(m => m[1]).flatMap(s => (s === 'js/measurement/dsp.js' ? [s, 'tests/fixtures.js'] : [s]));
    for (const src of srcs) await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src)); document.body.appendChild(s); });
    return srcs;
  })();
</script>
<script src="tests/rt60-responsiveness.test.js"></script>
</body>
</html>
